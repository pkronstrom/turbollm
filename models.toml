[defaults]
port = 8899
backend = "vllm-mlx"

[defaults.sampling]
temperature = 0.6
top_p = 0.95
top_k = 20

[defaults.opencode]
context_length = 32768
output_length = 8192

# --- Harnesses (agent CLIs) ---
# Each harness auto-gets OPENAI_BASE_URL + OPENAI_API_KEY pointed at the turbo server.
# Template vars in cmd/env: {model_id}, {port}

[harnesses.opencode]
binary = "opencode"
install = "go install github.com/opencode-ai/opencode@latest"
# Uses custom launcher (JSON config generation)

[harnesses.hermes]
binary = "hermes"
install = "pip install hermes-agent"
cmd = ["hermes", "--model", "{model_id}"]

[harnesses.goose]
binary = "goose"
install = "brew install goose"
cmd = ["goose"]
env = { GOOSE_PROVIDER = "openai", GOOSE_MODEL = "{model_id}" }

[harnesses.codex]
binary = "codex"
install = "npm install -g @openai/codex"
cmd = ["codex", "--model", "{model_id}"]

[harnesses.aichat]
binary = "aichat"
install = "brew install aichat"
cmd = ["aichat", "-m", "openai:{model_id}"]

[harnesses.qwen-code]
binary = "qwen"
install = "pip install qwen-code"
cmd = ["qwen", "--model", "{model_id}"]

# --- MLX models (served via vllm-mlx) ---

[models.qwen36-35b-mlx-4bit]
name = "Qwen3.6 35B-A3B MLX 4bit"
backend = "vllm-mlx"
hf_repo = "mlx-community/Qwen3.6-35B-A3B-4bit"
# draft_hf_repo = "mlx-community/Qwen3-0.6B-4bit"
# NOTE: specprefill broken for Qwen3.5/3.6 MoE — mixed attention (full+SWA+linear) breaks
# KV cache in speculative decoding. See vllm-project/vllm#36872. Waiting for upstream fix.
size_gb = 20
min_memory_gb = 24
tool_use = true
can_reason = true
tags = ["coding", "moe"]
tool_call_parser = "hermes"

[models.qwen36-35b-mlx-4bit.server]
paged_cache = true
cache_memory_percent = 0.40
max_tokens = 65536
max_request_tokens = 65536
timeout = 600
# --- Broken flags for Qwen3.6 (all produce "!!!" garbage output) ---
# Root cause: Qwen3.6 mixed attention (full + SWA + linear) is incompatible
# with any vllm-mlx optimization that modifies KV cache or batch scheduling.
# continuous_batching = true    # batched requests corrupt linear attention state
# kv_cache_quantization = true  # quantized cache breaks linear attention precision
# chunked_prefill_tokens = 2048 # chunked prefill corrupts cross-chunk attention
# specprefill = true            # draft model KV mismatch with target (vllm#36872)

[models.qwen36-35b-mlx-4bit.opencode]
context_length = 65536
output_length = 16384

# --- GGUF models ---

[models.qwen36-35b-gguf-q4km]
name = "Qwen3.6 35B-A3B GGUF Q4_K_M"
backend = "gguf"
hf_repo = "unsloth/Qwen3.6-35B-A3B-GGUF"
hf_file = "Qwen3.6-35B-A3B-Q4_K_M.gguf"
# draft_hf_repo = "unsloth/Qwen3-0.6B-GGUF"
# draft_hf_file = "Qwen3-0.6B-Q4_K_M.gguf"
# NOTE: speculative decoding broken for Qwen3.5/3.6 MoE — see vllm#36872
# llama.cpp --model-draft may have same issue. Revisit when upstream fixes land.
size_gb = 20
min_memory_gb = 24
tool_use = true
can_reason = true
tags = ["coding", "moe"]

[models.qwen36-35b-gguf-q4km.opencode]
context_length = 65536
output_length = 16384

[models.qwen36-35b-gguf-q4km.server]
ngl = 999
threads = 8
context = 65536
batch = 512
ubatch = 1024
flash_attention = true
cache_type_k = "q8_0"             # may cause issues — test before using, same linear attn concern
cache_type_v = "q8_0"
swa_full = true
no_context_shift = true
keep = 1024
parallel = 1
enable_thinking = false
jinja = true
mlock = true

