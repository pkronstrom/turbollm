[defaults]
port = 8899
backend = "vllm-mlx"

[defaults.sampling]
# Global fallbacks. Each model selects a named preset via `sampling = "..."`
# (see [sampling.*] blocks below); per-model presets override these.
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0

[defaults.opencode]
context_length = 32768
output_length = 8192

[defaults.omlx]
model_dir = "~/.omlx/models"
paged_ssd_cache_dir = "~/.omlx/cache"
paged_ssd_cache_max_size = "100GB"
hot_cache_max_size = "8GB"
max_concurrent_requests = 8

[defaults.mlx-audio]
# ASR runs on its own port so it can sit alongside an LLM on 8899.
port = 8900

# --- Sampler presets ---------------------------------------------------------
# Reference these from models via `sampling = "<preset-name>"`. The provider
# resolves the preset to individual --temp / --top-p / --top-k flags at serve
# time. Add new presets here when you onboard a new model family.

[sampling.qwen3-thinking-coding]
# Qwen's published recipe for Qwen3.6 thinking-mode coding tasks.
# Source: https://huggingface.co/Qwen/Qwen3.6-27B (and 35B-A3B card)
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0

[sampling.gemma-4]
# Google's published recipe for Gemma 4.
# Source: https://huggingface.co/google/gemma-4-31B-it
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
repeat_penalty = 1.0

# --- Harnesses (agent CLIs) --------------------------------------------------
# Each harness auto-gets OPENAI_BASE_URL + OPENAI_API_KEY pointed at the turbo
# server. Template vars in cmd/env: {model_id}, {port}

[harnesses.claude]
binary = "claude"
install = "npm install -g @anthropic-ai/claude-code"
# Uses custom launcher (ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN)

[harnesses.opencode]
binary = "opencode"
install = "brew install opencode"
# Uses custom launcher (JSON config generation)

[harnesses.hermes]
binary = "hermes"
install = "uv tool install git+https://github.com/NousResearch/hermes-agent.git"
# Uses custom launcher (temp HERMES_HOME with config.yaml pointing at turbo server)

[harnesses.goose]
binary = "goose"
install = "curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | bash"
cmd = ["goose"]
# goose reads OPENAI_HOST (not OPENAI_BASE_URL) for the OpenAI provider endpoint
env = { GOOSE_PROVIDER = "openai", GOOSE_MODEL = "{model_id}", OPENAI_HOST = "http://127.0.0.1:{port}" }

[harnesses.codex]
binary = "codex"
install = "brew install --cask codex"
cmd = [
    "codex",
    "-c", "model_provider=\"turbo\"",
    "-c", "model_providers.turbo.name=\"TurboLLM\"",
    "-c", "model_providers.turbo.base_url=\"http://127.0.0.1:{port}/v1\"",
    "-c", "model_providers.turbo.env_key=\"OPENAI_API_KEY\"",
    "-m", "{model_id}",
]

[harnesses.aichat]
binary = "aichat"
install = "brew install aichat"
cmd = ["aichat", "-m", "openai:{model_id}"]

[harnesses.qwen-code]
binary = "qwen"
install = "brew install qwen-code"
cmd = ["qwen", "--model", "{model_id}"]

[harnesses.pi]
binary = "pi"
install = "npm install -g @mariozechner/pi-coding-agent"
# Uses custom launcher (models.json provider config pointing at turbo server)
# Per-invocation pi extensions, loaded via `pi -e <path>`. Active only when pi
# is launched through turbo (interactive sessions started with `pi` directly
# are unaffected). Use this for guards we want during delegated/headless runs
# without polluting normal pi usage. Example: pi-autocompact auto-summarizes
# the conversation when context usage crosses 80% — keeps long agent loops
# alive instead of silently truncating at the model's context cap. Add your
# own paths in ~/.turbollm/models.toml:
#   extensions = ["~/path/to/pi-autocompact/src/index.ts"]
extensions = []

# --- Models ------------------------------------------------------------------
# Model entries declare capability + sensible defaults; the arrow-key picker
# (and provider code) read context_default / context_max / sampling /
# kv_quant directly. [server] is for truly backend-specific flags only.
#
# Per-model fields:
#   context_default  Picker's default landing context (tokens). Used as the
#                    fallback for direct (non-picker) invocations and harness
#                    context_window when the picker hasn't run.
#   context_max      Picker ceiling (tokens). Set to the practical max for
#                    128GB unified memory; raise if you have more RAM.
#   sampling         Name of a [sampling.*] preset above.
#   kv_quant         off | q8 | q4 | auto. `auto` resolves per backend in
#                    registry.effective_kv_quant: gguf→q8, others→off.

[models.qwen36-35b-4bit]
name = "Qwen3.6 35B-A3B 4bit"
backend = "vllm-mlx"
hf_repo = "mlx-community/Qwen3.6-35B-A3B-4bit"
# draft_hf_repo = "mlx-community/Qwen3-0.6B-4bit"
# NOTE: specprefill broken for Qwen3.5/3.6 MoE — mixed attention (full+SWA+linear)
# breaks KV cache in speculative decoding. See vllm-project/vllm#36872.
size_gb = 20
min_memory_gb = 24
tool_use = true
can_reason = true
tags = ["coding", "moe"]
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"

# 128GB M4 Max sizing: 192K is safe at 4bit + mixed attention (~38 GB KV).
context_default = 65536      # 64K — picker default landing
context_max = 196608         # 192K — picker ceiling

sampling = "qwen3-thinking-coding"
# Qwen3.6's mixed (linear + softmax) attention breaks under KV-cache
# quantization on vllm-mlx; leave off until upstream support lands.
kv_quant = "off"

[models.qwen36-35b-4bit.server]
paged_cache = true
cache_memory_percent = 0.40
timeout = 600
default_chat_template_kwargs = { preserve_thinking = true }
# --- Known-broken flags for Qwen3.6 on vllm-mlx (do NOT enable):
# continuous_batching = true     # batched requests corrupt linear attention state
# kv_cache_quantization = true   # see kv_quant = "off" above
# chunked_prefill_tokens = 2048  # chunked prefill corrupts cross-chunk attention
# specprefill = true             # draft KV mismatch with target (vllm#36872)

[models.qwen36-27b-6bit]
name = "Qwen3.6 27B 6bit + MTP (mlx-vlm)"
backend = "mlx-vlm"
hf_repo = "unsloth/Qwen3.6-27B-UD-MLX-6bit"
# MTP speculative-decoding drafter (tiny head). Server-path MTP works for Qwen
# (validated 2026-06-09): ~13.4 -> 21.0 tok/s (+57%), ~2x prior vllm-mlx (10.7),
# 89.7% draft acceptance, tool-calling + pi verified. mlx-vlm auto-parses tools,
# so no tool_call_parser/reasoning_parser flags needed (those are vllm-mlx-only).
draft_hf_repo = "mlx-community/Qwen3.6-27B-MTP-5bit"
size_gb = 30
min_memory_gb = 36
tool_use = true
can_reason = true
tags = ["coding", "dense", "qwen", "mtp"]

# 128GB M4 Max sizing: 192K is safe at 6bit + mixed attention (~38 GB KV);
# weights are ~30 GB so total stays under ~75 GB peak.
context_default = 65536
context_max = 196608

sampling = "qwen3-thinking-coding"
kv_quant = "off"

[models.qwen36-27b-6bit.server]
draft_kind = "mtp"
timeout = 600

[models.qwen36-27b-6bit.pi]
# Default budget for pi sessions — qwen3.6 27B's reasoning can dominate
# wall-clock on local hardware. Override per invocation with
# `turbo pi --thinking <off|minimal|low|medium|high|xhigh>`.
thinking = "low"
thinking_format = "qwen-chat-template"

[models.gemma4-31b-it-mlx-4bit]
name = "Gemma 4 31B IT UD MLX 4bit"
backend = "vllm-mlx"
hf_repo = "unsloth/gemma-4-31b-it-UD-MLX-4bit"
local_path = "~/.models/unsloth/gemma-4-31b-it-UD-MLX-4bit"
size_gb = 22
min_memory_gb = 48
tool_use = true
can_reason = true
tags = ["coding", "dense", "vision", "gemma", "4bit"]
tool_call_parser = "gemma4"
reasoning_parser = "gemma4"

# Gemma 4's hybrid SWA + global attention bounds local-layer KV, so memory
# scales gracefully with context — 256K is achievable on 128GB.
context_default = 65536
context_max = 262144

sampling = "gemma-4"
# Gemma 4 KV quant on vllm-mlx untested. Conservative default; flip to "q8"
# once you've measured no quality loss on your eval set.
kv_quant = "off"

[models.gemma4-31b-it-mlx-4bit.server]
paged_cache = true
cache_memory_percent = 0.40
timeout = 600
default_chat_template_kwargs = { enable_thinking = false }

[models.gemma4-31b-it-mlx-4bit.pi]
reasoning = false
thinking = "off"
thinking_format = "qwen-chat-template"

[models.gemma4-31b-it-mlx-4bit.pi.compat]
thinkingFormat = "qwen-chat-template"
requiresToolResultName = true
requiresAssistantAfterToolResult = true

[models.gemma4-26b-a4b-it-mlx-4bit]
name = "Gemma 4 26B-A4B IT UD MLX 4bit"
backend = "vllm-mlx"
hf_repo = "unsloth/gemma-4-26b-a4b-it-UD-MLX-4bit"
local_path = "~/.models/unsloth/gemma-4-26b-a4b-it-UD-MLX-4bit"
size_gb = 15
min_memory_gb = 48
tool_use = true
can_reason = true
tags = ["coding", "moe", "vision", "gemma", "4bit"]
tool_call_parser = "gemma4"
reasoning_parser = "gemma4"

# Same Gemma 4 hybrid-attention math as the 31B; lighter weights → more
# slack, but keep the same conservative 256K ceiling.
context_default = 65536
context_max = 262144

sampling = "gemma-4"
kv_quant = "off"

[models.gemma4-26b-a4b-it-mlx-4bit.server]
paged_cache = true
cache_memory_percent = 0.40
timeout = 600
default_chat_template_kwargs = { enable_thinking = false }

[models.gemma4-26b-a4b-it-mlx-4bit.pi]
reasoning = false
thinking = "off"
thinking_format = "qwen-chat-template"

[models.gemma4-26b-a4b-it-mlx-4bit.pi.compat]
thinkingFormat = "qwen-chat-template"
requiresToolResultName = true
requiresAssistantAfterToolResult = true

# NOTE (2026-06-09): Gemma 4 MTP on mlx-vlm 0.6.2 does NOT speed up the server
# (continuous-batching) path — drafter loads but batched decode sees ~0 gain
# (generate-path got +30%). Revisit when mlx-vlm Gemma server-MTP matures
# (track "Improve Gemma4 MTP server batching" #1166 / mlx-lm native MTP #990).
# Spike entry + 15GB QAT target removed. See docs/superpowers/specs/2026-06-09-*.

# --- GGUF models -------------------------------------------------------------

[models.qwen36-35b-gguf-q4km]
name = "Qwen3.6 35B-A3B GGUF Q4_K_M"
backend = "gguf"
hf_repo = "unsloth/Qwen3.6-35B-A3B-GGUF"
hf_file = "Qwen3.6-35B-A3B-Q4_K_M.gguf"
# draft_hf_repo = "unsloth/Qwen3-0.6B-GGUF"
# NOTE: speculative decoding broken for Qwen3.5/3.6 MoE — see vllm#36872.
size_gb = 20
min_memory_gb = 24
tool_use = true
can_reason = true
tags = ["coding", "moe"]

# 128GB sizing: q8 K/V (set below) halves KV memory, so 192K is comfortable.
context_default = 65536
context_max = 196608

sampling = "qwen3-thinking-coding"
# Unsloth's published guidance for Qwen3.6-GGUF: q8_0 K/V is recommended; q4
# desyncs Gated DeltaNet state. Source: https://unsloth.ai/docs/models/qwen3.6
kv_quant = "q8"

[models.qwen36-35b-gguf-q4km.server]
ngl = 999
threads = 8
batch = 512
ubatch = 1024
flash_attention = true
swa_full = true
no_context_shift = true
keep = 1024
parallel = 1
enable_thinking = false
jinja = true
mlock = true


# --- ASR (mlx-audio) ----------------------------------------------------------
# ASR models don't use sampling / kv_quant / context fields — the mlx-audio
# server picks the model per-request via the API `model=` field. We list them
# like LLMs so `turbo pull`, `turbo serve`, and `turbo transcribe` resolve
# aliases uniformly.

[models.parakeet-v3]
name = "parakeet-v3"
backend = "mlx-audio"
hf_repo = "mlx-community/parakeet-tdt-0.6b-v3"
size_gb = 1.2
tags = ["asr", "multilingual"]
# Parakeet TDT 0.6B v3 — NVIDIA-trained, MLX-ported by mlx-community.
# Covers 25 European languages incl. English, Finnish, Swedish.


# --- Scripts ------------------------------------------------------------------
# Declarative `turbo <name>` commands. Each [scripts.<name>] becomes a click
# subcommand; `command` runs via /bin/sh -c with $0=<name>, $1..$N = forwarded
# args. ALWAYS quote positional refs ("$1") so paths with spaces survive.
# Built-in commands > harnesses > scripts when names collide.

[scripts.summarize]
description = "Transcribe an audio file and summarize via local LLM"
usage = "FILE"
# --no-extensions: headless pi doesn't need TUI extensions like
# pi-powerline-footer; some of them error on non-interactive sessions.
command = """
turbo transcribe "$1" \
  | pi --no-extensions -p 'Summarize this meeting transcript. Output markdown with sections: Summary, Decisions, Action items (owner if mentioned), Open questions.'
"""

[scripts.summarize-to-obsidian]
description = "Transcribe, summarize, save to Obsidian Meetings folder"
usage = "FILE"
# Set $OBSIDIAN_VAULT to your vault root (defaults to ~/Documents/Obsidian).
# Writes $VAULT/Meetings/<audio-basename>.md with YAML frontmatter. Rename
# manually in Obsidian once you've reviewed the content.
command = """
set -euo pipefail
vault="${OBSIDIAN_VAULT:-$HOME/Documents/Obsidian}"

# $1 may be either a plain audio path (manual invocation) or the JSON
# manifest emitted by `turbo-acquirer record-audio` since Phase 2's
# alignment work (e.g. `{"path":"/...wav","start_offset_ms":N}`).
# Permissively unwrap either shape into a plain audio_file path.
if [[ "$1" == \\{* ]]; then
  audio_file="$(printf '%s' "$1" | python3 -c "import json,sys; print(json.load(sys.stdin)['path'])")"
else
  audio_file="$1"
fi
bn="${audio_file##*/}"
slug="${bn%.*}"
out="$vault/Meetings/$slug.md"
raw_out="$vault/Meetings/$slug.raw.md"
mkdir -p "$(dirname "$out")"

# Single transcribe call: ask for the full verbose_json blob and extract both
# the plain-text transcript (for the LLM prompt) and segments[] (for .raw.md)
# from one mlx-audio response. Avoids paying the parakeet-v3 model load twice.
blob="$(turbo transcribe --format verbose_json "$audio_file")"
transcript="$(printf '%s' "$blob" | python3 -c "import json,sys; print(json.load(sys.stdin).get('text','').strip())")"
# mlx-audio's parakeet returns sentences[] (with start/end from token alignment);
# whisper-shaped backends return segments[]. Normalise either to {start,end,text}.
segments_json="$(printf '%s' "$blob" | python3 -c "
import json, sys
data = json.load(sys.stdin)
segs = data.get('segments') or []
if not segs:
    segs = [{'start': s.get('start', 0.0), 'end': s.get('end'), 'text': (s.get('text') or '').strip()}
            for s in (data.get('sentences') or [])]
print(json.dumps(segs))
")"

# Write .raw.md: [mm:ss] <text> lines from the segments JSON. The empty-segments
# fallback below only fires for truly silent input (no sentences, no segments).
SEGMENTS_JSON="$segments_json" TRANSCRIPT="$transcript" python3 -c '
import json, math, os, sys
segs = json.loads(os.environ["SEGMENTS_JSON"])
if not segs:
    print("warning: mlx-audio returned no segments; emitting single-segment fallback", file=sys.stderr)
    text = os.environ.get("TRANSCRIPT", "").strip()
    if text:
        print(f"[00:00] {text}")
    sys.exit(0)
for seg in segs:
    start = seg.get("start") or 0
    mm = math.floor(start / 60)
    ss = math.floor(start % 60)
    text = (seg.get("text") or "").strip()
    print(f"[{mm:02d}:{ss:02d}] {text}")
' > "$raw_out"

# Summarise with Qwen3.6 35B-A3B via direct /v1/chat/completions — no agent
# harness, no tool schemas, no extensions. Overhead is ~50 tokens of framing,
# so we can size context honestly to (transcript + small headroom).
n_chars=$(printf '%s' "$transcript" | wc -c | tr -d ' ')
if [ "$n_chars" -lt 20 ]; then
  # Nothing worth summarising — skip the 35B load entirely and leave a marker
  # note. This is the silent-audio path that used to crash pi at 32K.
  summary="_No speech detected in recording (transcript was ${n_chars} chars)._"
  ctx=0
  echo "[summarize] transcript=${n_chars} chars; skipping qwen (empty)" >&2
else
  # ~3 chars/token for FI/EN mixed; +1K headroom for system prompt + framing.
  # Target ≤70% utilisation of the chosen bucket so the model has room to reply.
  prompt_tokens=$(( n_chars / 3 + 1024 ))
  min_ctx=$(( prompt_tokens * 10 / 7 ))
  if   [ "$min_ctx" -le  32768 ]; then ctx=32768
  elif [ "$min_ctx" -le  65536 ]; then ctx=65536
  elif [ "$min_ctx" -le 131072 ]; then ctx=131072
  else                                  ctx=196608
  fi
  echo "[summarize] transcript=${n_chars} chars; sizing qwen context_window=${ctx}" >&2

  # Start qwen on :8899 if no compatible server is up. pkill -P is needed because
  # `turbo serve` runs vllm-mlx as a child and doesn't forward SIGTERM itself.
  if ! curl -sf -m 2 http://127.0.0.1:8899/v1/models 2>/dev/null | grep -q "Qwen3.6-35B-A3B-4bit"; then
    turbo serve qwen36-35b-4bit --context-window "$ctx" >/dev/null 2>&1 &
    serve_pid=$!
    trap 'pkill -P "$serve_pid" 2>/dev/null; kill "$serve_pid" 2>/dev/null; wait "$serve_pid" 2>/dev/null || true' EXIT
    for _ in $(seq 1 180); do
      curl -sf -m 2 http://127.0.0.1:8899/v1/models >/dev/null && break
      sleep 1
    done
    curl -sf -m 2 http://127.0.0.1:8899/v1/models >/dev/null || { echo "qwen server failed to start within 180s" >&2; exit 1; }
  fi

  export SYS_PROMPT='You are a note-taking assistant. The user records audio of varied content: meetings, lectures, voice memos, brainstorms, interviews, walking thoughts. Produce a faithful markdown summary that will land in their Obsidian vault. The transcript on stdin is authoritative ground truth — base every claim on it. Never reference yourself, the user, "the workspace", "the message", "the snippet", or your own context. Output markdown only, with no preamble or sign-off.

Summarize the transcript on stdin. Choose section headings that fit the actual content — do NOT force a fixed structure. Prefer concrete bullet points where they fit, prose where they do not. Use shapes like Decisions / Action items / Open questions / Key points / Notable quotes / Topics ONLY when the content genuinely contains them. Detect the transcript language and write the summary in that same language; do not translate.'

  summary="$(printf '%s' "$transcript" | python3 -c '
import json, os, sys, urllib.request
transcript = sys.stdin.read()
body = json.dumps({
    "model": "mlx-community/Qwen3.6-35B-A3B-4bit",
    "messages": [
        {"role": "system", "content": os.environ["SYS_PROMPT"]},
        {"role": "user", "content": transcript},
    ],
    "max_tokens": 8192,
}).encode()
req = urllib.request.Request(
    "http://127.0.0.1:8899/v1/chat/completions",
    data=body, headers={"Content-Type": "application/json"})
with urllib.request.urlopen(req, timeout=900) as r:
    print(json.loads(r.read())["choices"][0]["message"]["content"])
')"
fi

{
  printf -- '---\n'
  printf 'date: %s\n' "$(date -Iseconds)"
  printf 'source: %s\n' "$audio_file"
  printf 'tags: [meeting, auto-transcribed]\n'
  printf 'model: parakeet-v3 + qwen36-35b-4bit\n'
  printf 'context_window: %s\n' "$ctx"
  printf -- '---\n\n'
  printf '# %s\n\n' "$slug"
  printf '%s\n\n' "$summary"
  printf -- '---\n\n## Raw transcript\n\n'
  printf '%s\n' "$transcript"
} > "$out"

echo "Wrote: $out" >&2
echo "Wrote: $raw_out" >&2
"""

[scripts.summarize-to-obsidian-bundled]
description = "Transcribe audio + embed screen keyframes, save bundled notes to Obsidian"
usage = "AUDIO_MANIFEST_JSON SCREEN_MANIFEST_JSON"
# $1 — audio manifest JSON: {"path":"...","start_offset_ms":N}  (from audio acquirer)
# $2 — screen recording manifest JSON string (from record-screen acquirer)
# Writes three artifacts:
#   $VAULT/Meetings/<slug>.md           — frontmatter + summary (no image refs)
#   $VAULT/Meetings/<slug>.raw.md       — frontmatter + interleaved [mm:ss] and ![[...]] lines
#   $VAULT/Meetings/attachments/<slug>/ — PNG copies of keyframes
# Deletes the temp source directory after copying PNGs.
command = """
set -euo pipefail
vault="${OBSIDIAN_VAULT:-$HOME/Documents/Obsidian}"
audio_manifest_json="$1"
manifest_json="$2"
# Extract audio file path from the audio manifest JSON via Python.
audio_file="$(printf '%s' "$audio_manifest_json" | python3 -c "import json,sys; print(json.load(sys.stdin)['path'])")"
bn="${audio_file##*/}"
slug="${bn%.*}"
out="$vault/Meetings/$slug.md"
raw_out="$vault/Meetings/$slug.raw.md"
attachments="$vault/Meetings/attachments/$slug"
mkdir -p "$(dirname "$out")" "$attachments"

# Single transcribe call: extract text + segments from one verbose_json blob
# to avoid paying the parakeet-v3 model load twice (see summarize-to-obsidian
# for the same pattern). Normalise parakeet's sentences[] → segments shape.
blob="$(turbo transcribe --format verbose_json "$audio_file")"
transcript="$(printf '%s' "$blob" | python3 -c "import json,sys; print(json.load(sys.stdin).get('text','').strip())")"
segments_json="$(printf '%s' "$blob" | python3 -c "
import json, sys
data = json.load(sys.stdin)
segs = data.get('segments') or []
if not segs:
    segs = [{'start': s.get('start', 0.0), 'end': s.get('end'), 'text': (s.get('text') or '').strip()}
            for s in (data.get('sentences') or [])]
print(json.dumps(segs))
")"

# Summarise with Qwen3.6 35B-A3B via direct /v1/chat/completions — no agent
# harness, no tool schemas. See summarize-to-obsidian for the full rationale.
n_chars=$(printf '%s' "$transcript" | wc -c | tr -d ' ')
if [ "$n_chars" -lt 20 ]; then
  summary="_No speech detected in recording (transcript was ${n_chars} chars)._"
  ctx=0
  echo "[summarize] transcript=${n_chars} chars; skipping qwen (empty)" >&2
else
  prompt_tokens=$(( n_chars / 3 + 1024 ))
  min_ctx=$(( prompt_tokens * 10 / 7 ))
  if   [ "$min_ctx" -le  32768 ]; then ctx=32768
  elif [ "$min_ctx" -le  65536 ]; then ctx=65536
  elif [ "$min_ctx" -le 131072 ]; then ctx=131072
  else                                  ctx=196608
  fi
  echo "[summarize] transcript=${n_chars} chars; sizing qwen context_window=${ctx}" >&2

  if ! curl -sf -m 2 http://127.0.0.1:8899/v1/models 2>/dev/null | grep -q "Qwen3.6-35B-A3B-4bit"; then
    turbo serve qwen36-35b-4bit --context-window "$ctx" >/dev/null 2>&1 &
    serve_pid=$!
    trap 'pkill -P "$serve_pid" 2>/dev/null; kill "$serve_pid" 2>/dev/null; wait "$serve_pid" 2>/dev/null || true' EXIT
    for _ in $(seq 1 180); do
      curl -sf -m 2 http://127.0.0.1:8899/v1/models >/dev/null && break
      sleep 1
    done
    curl -sf -m 2 http://127.0.0.1:8899/v1/models >/dev/null || { echo "qwen server failed to start within 180s" >&2; exit 1; }
  fi

  export SYS_PROMPT='You are a note-taking assistant. The user records audio of varied content: meetings, lectures, voice memos, brainstorms, interviews, walking thoughts. Produce a faithful markdown summary that will land in their Obsidian vault. The transcript on stdin is authoritative ground truth — base every claim on it. Never reference yourself, the user, "the workspace", "the message", "the snippet", or your own context. Output markdown only, with no preamble or sign-off.

Summarize the transcript on stdin. Choose section headings that fit the actual content — do NOT force a fixed structure. Prefer concrete bullet points where they fit, prose where they do not. Use shapes like Decisions / Action items / Open questions / Key points / Notable quotes / Topics ONLY when the content genuinely contains them. Detect the transcript language and write the summary in that same language; do not translate.'

  summary="$(printf '%s' "$transcript" | python3 -c '
import json, os, sys, urllib.request
transcript = sys.stdin.read()
body = json.dumps({
    "model": "mlx-community/Qwen3.6-35B-A3B-4bit",
    "messages": [
        {"role": "system", "content": os.environ["SYS_PROMPT"]},
        {"role": "user", "content": transcript},
    ],
    "max_tokens": 8192,
}).encode()
req = urllib.request.Request(
    "http://127.0.0.1:8899/v1/chat/completions",
    data=body, headers={"Content-Type": "application/json"})
with urllib.request.urlopen(req, timeout=900) as r:
    print(json.loads(r.read())["choices"][0]["message"]["content"])
')"
fi

# Write .md (no image references).
{
  printf -- '---\n'
  printf 'date: %s\n' "$(date -Iseconds)"
  printf 'source: %s\n' "$audio_file"
  printf 'tags: [meeting, auto-transcribed]\n'
  printf 'model: parakeet-v3 + local-llm\n'
  printf -- '---\n\n'
  printf '# %s\n\n' "$slug"
  printf '%s\n' "$summary"
} > "$out"

# Copy PNGs to attachments dir, then delete temp source dir, then write .raw.md.
SEGMENTS_JSON="$segments_json" \
TRANSCRIPT="$transcript" \
MANIFEST_JSON="$manifest_json" \
AUDIO_MANIFEST_JSON="$audio_manifest_json" \
ATTACHMENTS="$attachments" \
SLUG="$slug" \
OUT="$out" \
RAW_OUT="$raw_out" \
AUDIO_FILE="$audio_file" \
SUMMARY="$summary" \
python3 << 'PYEOF'
import json, os, shutil, math, sys, datetime

segs          = json.loads(os.environ['SEGMENTS_JSON'])
manifest      = json.loads(os.environ['MANIFEST_JSON'])
audio_manifest = json.loads(os.environ['AUDIO_MANIFEST_JSON'])
att_dir       = os.environ['ATTACHMENTS']
slug          = os.environ['SLUG']
raw_out       = os.environ['RAW_OUT']
audio         = os.environ['AUDIO_FILE']
summary       = os.environ['SUMMARY']
transcript    = os.environ.get('TRANSCRIPT', '').strip()

# Fallback when mlx-audio returned text without segment timestamps: synthesize
# a single segment at start=0 carrying the full transcript, so the interleaved
# .raw.md still has the spoken content (just without finer-grained timing).
if not segs and transcript:
    print("warning: mlx-audio returned no segments; emitting single-segment fallback", file=sys.stderr)
    segs = [{"start": 0, "text": transcript}]

# Screen keyframe time origin relative to T0.
screen_start_offset_ms = manifest.get('start_offset_ms', 0)
# Audio segment time origin relative to T0.
audio_start_offset_ms = audio_manifest.get('start_offset_ms', 0)

# Copy PNGs and collect keyframe entries.
entries = []
for frame in manifest.get('frames', []):
    src = frame['path']
    basename = os.path.basename(src)
    dst = os.path.join(att_dir, basename)
    shutil.copy2(src, dst)
    wf_t_ms = frame['t_offset_ms'] + screen_start_offset_ms
    entries.append({'wf_t_ms': wf_t_ms, 'kind': 'frame', 'basename': basename})

# Delete the temp source directory (parent of the first frame path).
if manifest.get('frames'):
    src_dir = os.path.dirname(manifest['frames'][0]['path'])
    if os.path.isdir(src_dir):
        shutil.rmtree(src_dir)

# Add segment entries — shift by audio start offset so they land at workflow time.
for seg in segs:
    start_s = seg.get('start') or 0
    wf_t_ms = int(start_s * 1000) + audio_start_offset_ms
    text = seg.get('text', '').strip()
    mm = math.floor(start_s / 60)
    ss = math.floor(start_s % 60)
    entries.append({'wf_t_ms': wf_t_ms, 'kind': 'segment',
                    'label': f'[{mm:02d}:{ss:02d}] {text}'})

# Sort by workflow time; segments before frames on tie.
entries.sort(key=lambda e: (e['wf_t_ms'], 0 if e['kind'] == 'segment' else 1))

# Build raw lines.
lines = []
for e in entries:
    if e['kind'] == 'segment':
        lines.append(e['label'])
    else:
        lines.append(f"![[{slug}/{e['basename']}]]")

# Write .raw.md with frontmatter.
now = datetime.datetime.now().astimezone().isoformat(timespec='seconds')
with open(raw_out, 'w') as fh:
    print('---', file=fh)
    print('date: ' + now, file=fh)
    print('source: ' + audio, file=fh)
    print('tags: [meeting, auto-transcribed]', file=fh)
    print('model: parakeet-v3 + local-llm', file=fh)
    print('---', file=fh)
    print('', file=fh)
    for line in lines:
        print(line, file=fh)
PYEOF

echo "Wrote: $out" >&2
echo "Wrote: $raw_out" >&2
echo "Wrote: $attachments" >&2
"""


# --- Workflows ----------------------------------------------------------------
# HUD-renderable named actions with typed params. Surfaced via
# `turbo workflows list --json` and runnable via `turbo workflows run <name>`.
# See internal HUD design spec for full schema.

[workflows.transcribe-file]
description = "Transcribe an audio file to stdout"
command = 'turbo transcribe "{{file}}"'

[[workflows.transcribe-file.params]]
name = "file"
type = "file"
extensions = ["m4a", "wav", "mp3", "flac"]


[workflows.record-to-obsidian]
description = "Record audio, summarize, save to Obsidian (HUD-only: needs audio-recording acquirer)"
script = "summarize-to-obsidian"
args = ["{{audio}}"]
# Plumb the resolved `vault` param through so the HUD's vault picker steers
# output instead of being cosmetic. The script reads $OBSIDIAN_VAULT (with a
# $HOME/Documents/Obsidian fallback).
env = { OBSIDIAN_VAULT = "{{vault}}" }

[[workflows.record-to-obsidian.params]]
name = "audio"
type = "audio-recording"
mode = "primary"
scope = "system+mic"

[[workflows.record-to-obsidian.params]]
name = "vault"
type = "directory"
default_env = "OBSIDIAN_VAULT"


[workflows.record-meeting-with-screen]
description = "Record audio + screen, transcribe, summarize, bundle into Obsidian"
script = "summarize-to-obsidian-bundled"
args = ["{{audio}}", "{{screen}}"]
env = { OBSIDIAN_VAULT = "{{vault}}" }

[[workflows.record-meeting-with-screen.params]]
name = "audio"
type = "audio-recording"
mode = "primary"
scope = "system+mic"

[[workflows.record-meeting-with-screen.params]]
name = "screen"
type = "screen-recording"
mode = "background"
keyframe_threshold = 12
min_interval_ms = 1500
max_keyframes = 200

[[workflows.record-meeting-with-screen.params]]
name = "vault"
type = "directory"
default_env = "OBSIDIAN_VAULT"
