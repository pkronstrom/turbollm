[defaults]
port = 8899
backend = "vllm-mlx"

[defaults.sampling]
temperature = 0.6
top_p = 0.95
top_k = 20

[defaults.opencode]
context_length = 32768
output_length = 8192

# --- MLX models (served via vllm-mlx) ---

[models.qwen36-35b-mlx-4bit]
name = "Qwen3.6 35B-A3B MLX 4bit"
backend = "vllm-mlx"
hf_repo = "mlx-community/Qwen3.6-35B-A3B-4bit"
# draft_hf_repo = "mlx-community/Qwen3-0.6B-4bit"
# NOTE: specprefill broken for Qwen3.5/3.6 MoE — mixed attention (full+SWA+linear) breaks
# KV cache in speculative decoding. See vllm-project/vllm#36872. Waiting for upstream fix.
size_gb = 20
min_memory_gb = 24
tool_use = true
can_reason = true
tags = ["coding", "moe"]
tool_call_parser = "hermes"

[models.qwen36-35b-mlx-4bit.server]
continuous_batching = true
paged_cache = true
cache_memory_percent = 0.40   # 40% of 128GB = ~51GB for KV cache
max_tokens = 131072
max_request_tokens = 131072
timeout = 600                 # 10min for long agentic tasks

[models.qwen36-35b-mlx-4bit.opencode]
context_length = 131072
output_length = 32768

# --- GGUF models ---

[models.qwen36-35b-gguf-q4km]
name = "Qwen3.6 35B-A3B GGUF Q4_K_M"
backend = "gguf"
hf_repo = "unsloth/Qwen3.6-35B-A3B-GGUF"
hf_file = "Qwen3.6-35B-A3B-Q4_K_M.gguf"
draft_hf_repo = "unsloth/Qwen3-0.6B-GGUF"
draft_hf_file = "Qwen3-0.6B-Q4_K_M.gguf"
size_gb = 20
min_memory_gb = 24
tool_use = true
can_reason = true
tags = ["coding", "moe"]

[models.qwen36-35b-gguf-q4km.opencode]
context_length = 131072
output_length = 32768

[models.qwen36-35b-gguf-q4km.server]
ngl = 999
threads = 8
context = 131072
batch = 512
ubatch = 1024
flash_attention = true
cache_type_k = "q8_0"
cache_type_v = "q8_0"
swa_full = true
no_context_shift = true
keep = 1024
parallel = 1
enable_thinking = false
jinja = true
mlock = true

