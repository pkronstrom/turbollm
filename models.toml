[defaults]
port = 8899
backend = "vllm-mlx"

[defaults.sampling]
temperature = 0.6
top_p = 0.95
top_k = 20

[defaults.opencode]
context_length = 32768
output_length = 8192

[defaults.omlx]
model_dir = "~/.omlx/models"
paged_ssd_cache_dir = "~/.omlx/cache"
paged_ssd_cache_max_size = "100GB"
hot_cache_max_size = "8GB"
max_concurrent_requests = 8

# --- Harnesses (agent CLIs) ---
# Each harness auto-gets OPENAI_BASE_URL + OPENAI_API_KEY pointed at the turbo server.
# Template vars in cmd/env: {model_id}, {port}

[harnesses.claude]
binary = "claude"
install = "npm install -g @anthropic-ai/claude-code"
# Uses custom launcher (ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN)

[harnesses.opencode]
binary = "opencode"
install = "brew install opencode"
# Uses custom launcher (JSON config generation)

[harnesses.hermes]
binary = "hermes"
install = "uv tool install git+https://github.com/NousResearch/hermes-agent.git"
# Uses custom launcher (temp HERMES_HOME with config.yaml pointing at turbo server)

[harnesses.goose]
binary = "goose"
install = "curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | bash"
cmd = ["goose"]
# goose reads OPENAI_HOST (not OPENAI_BASE_URL) for the OpenAI provider endpoint
env = { GOOSE_PROVIDER = "openai", GOOSE_MODEL = "{model_id}", OPENAI_HOST = "http://127.0.0.1:{port}" }

[harnesses.codex]
binary = "codex"
install = "brew install --cask codex"
cmd = [
    "codex",
    "-c", "model_provider=\"turbo\"",
    "-c", "model_providers.turbo.name=\"TurboLLM\"",
    "-c", "model_providers.turbo.base_url=\"http://127.0.0.1:{port}/v1\"",
    "-c", "model_providers.turbo.env_key=\"OPENAI_API_KEY\"",
    "-m", "{model_id}",
]

[harnesses.aichat]
binary = "aichat"
install = "brew install aichat"
cmd = ["aichat", "-m", "openai:{model_id}"]

[harnesses.qwen-code]
binary = "qwen"
install = "brew install qwen-code"
cmd = ["qwen", "--model", "{model_id}"]

[harnesses.pi]
binary = "pi"
install = "npm install -g @mariozechner/pi-coding-agent"
# Uses custom launcher (models.json provider config pointing at turbo server)

# --- MLX models (served via vllm-mlx) ---

[models.qwen36-35b-4bit]
name = "Qwen3.6 35B-A3B 4bit"
backend = "vllm-mlx"
hf_repo = "mlx-community/Qwen3.6-35B-A3B-4bit"
# draft_hf_repo = "mlx-community/Qwen3-0.6B-4bit"
# NOTE: specprefill broken for Qwen3.5/3.6 MoE — mixed attention (full+SWA+linear) breaks
# KV cache in speculative decoding. See vllm-project/vllm#36872. Waiting for upstream fix.
size_gb = 20
min_memory_gb = 24
tool_use = true
can_reason = true
tags = ["coding", "moe"]
tool_call_parser = "hermes"
reasoning_parser = "qwen3"

[models.qwen36-35b-4bit.server]
paged_cache = true
cache_memory_percent = 0.40
# Qwen guidance prefers >=128K context for thinking-capable 3.6 sessions.
max_tokens = 131072
max_request_tokens = 131072
timeout = 600
# M4 Pro 128GB default: 128K is safe here and reduces early degradation in long agent runs.
# --- Broken flags for Qwen3.6 (all produce "!!!" garbage output) ---
# Root cause: Qwen3.6 mixed attention (full + SWA + linear) is incompatible
# with any vllm-mlx optimization that modifies KV cache or batch scheduling.
# continuous_batching = true    # batched requests corrupt linear attention state
# kv_cache_quantization = true  # quantized cache breaks linear attention precision
# chunked_prefill_tokens = 2048 # chunked prefill corrupts cross-chunk attention
# specprefill = true            # draft model KV mismatch with target (vllm#36872)

[models.qwen36-35b-4bit.opencode]
context_length = 131072
output_length = 16384

[models.qwen36-27b-6bit]
name = "Qwen3.6 27B UD 6bit"
backend = "vllm-mlx"
hf_repo = "unsloth/Qwen3.6-27B-UD-MLX-6bit"
size_gb = 30
min_memory_gb = 36
tool_use = true
can_reason = true
tags = ["coding", "dense", "vision"]
tool_call_parser = "hermes"
reasoning_parser = "qwen3"

[models.qwen36-27b-6bit.server]
paged_cache = true
cache_memory_percent = 0.40
# M4 Pro default: 27B is more reliable, but much slower than 35B-A3B at long context.
max_tokens = 65536
max_request_tokens = 65536
timeout = 600

[models.qwen36-27b-6bit.opencode]
context_length = 65536
output_length = 16384

[models.qwen36-27b-6bit-longctx]
name = "Qwen3.6 27B UD 6bit LongCtx"
backend = "vllm-mlx"
hf_repo = "unsloth/Qwen3.6-27B-UD-MLX-6bit"
size_gb = 30
min_memory_gb = 36
tool_use = true
can_reason = true
tags = ["coding", "dense", "vision", "longctx"]
tool_call_parser = "hermes"
reasoning_parser = "qwen3"

[models.qwen36-27b-6bit-longctx.server]
paged_cache = true
cache_memory_percent = 0.40
# Long-context variant for 128GB machines; slower than the default 27B profile.
max_tokens = 131072
max_request_tokens = 131072
timeout = 600

[models.qwen36-27b-6bit-longctx.opencode]
context_length = 131072
output_length = 16384

[models.gemma4-31b-it-mlx-4bit]
name = "Gemma 4 31B IT UD MLX 4bit"
backend = "vllm-mlx"
hf_repo = "unsloth/gemma-4-31b-it-UD-MLX-4bit"
local_path = "~/.models/unsloth/gemma-4-31b-it-UD-MLX-4bit"
size_gb = 22
min_memory_gb = 48
tool_use = true
can_reason = true
tags = ["coding", "dense", "vision", "gemma", "4bit"]
tool_call_parser = "gemma4"
reasoning_parser = "gemma4"

[models.gemma4-31b-it-mlx-4bit.server]
paged_cache = true
cache_memory_percent = 0.40
# 128GB MBP default. Gemma 4 supports 262K, but 64K is the practical
# single-user agent setting before validating long-context quality/latency.
max_tokens = 65536
max_request_tokens = 65536
timeout = 600
default_temperature = 1.0
default_top_p = 0.95
default_chat_template_kwargs = { enable_thinking = false }

[models.gemma4-31b-it-mlx-4bit.opencode]
context_length = 65536
output_length = 8192

[models.gemma4-31b-it-mlx-4bit.pi]
reasoning = false
thinking = "off"
thinking_format = "qwen-chat-template"

[models.gemma4-31b-it-mlx-4bit.pi.compat]
thinkingFormat = "qwen-chat-template"
requiresToolResultName = true
requiresAssistantAfterToolResult = true

[models.gemma4-26b-a4b-it-mlx-4bit]
name = "Gemma 4 26B-A4B IT UD MLX 4bit"
backend = "vllm-mlx"
hf_repo = "unsloth/gemma-4-26b-a4b-it-UD-MLX-4bit"
local_path = "~/.models/unsloth/gemma-4-26b-a4b-it-UD-MLX-4bit"
size_gb = 15
min_memory_gb = 48
tool_use = true
can_reason = true
tags = ["coding", "moe", "vision", "gemma", "4bit"]
tool_call_parser = "gemma4"
reasoning_parser = "gemma4"

[models.gemma4-26b-a4b-it-mlx-4bit.server]
paged_cache = true
cache_memory_percent = 0.40
# 128GB MBP default. This MoE is lighter than 31B dense, but keep the first
# profile at 64K until Gemma tool/chat behavior is proven stable.
max_tokens = 65536
max_request_tokens = 65536
timeout = 600
default_temperature = 1.0
default_top_p = 0.95
default_chat_template_kwargs = { enable_thinking = false }

[models.gemma4-26b-a4b-it-mlx-4bit.opencode]
context_length = 65536
output_length = 8192

[models.gemma4-26b-a4b-it-mlx-4bit.pi]
reasoning = false
thinking = "off"
thinking_format = "qwen-chat-template"

[models.gemma4-26b-a4b-it-mlx-4bit.pi.compat]
thinkingFormat = "qwen-chat-template"
requiresToolResultName = true
requiresAssistantAfterToolResult = true

# --- GGUF models ---

[models.qwen36-35b-gguf-q4km]
name = "Qwen3.6 35B-A3B GGUF Q4_K_M"
backend = "gguf"
hf_repo = "unsloth/Qwen3.6-35B-A3B-GGUF"
hf_file = "Qwen3.6-35B-A3B-Q4_K_M.gguf"
# draft_hf_repo = "unsloth/Qwen3-0.6B-GGUF"
# draft_hf_file = "Qwen3-0.6B-Q4_K_M.gguf"
# NOTE: speculative decoding broken for Qwen3.5/3.6 MoE — see vllm#36872
# llama.cpp --model-draft may have same issue. Revisit when upstream fixes land.
size_gb = 20
min_memory_gb = 24
tool_use = true
can_reason = true
tags = ["coding", "moe"]

[models.qwen36-35b-gguf-q4km.opencode]
context_length = 65536
output_length = 16384

[models.qwen36-35b-gguf-q4km.server]
ngl = 999
threads = 8
context = 65536
batch = 512
ubatch = 1024
flash_attention = true
cache_type_k = "q8_0"             # may cause issues — test before using, same linear attn concern
cache_type_v = "q8_0"
swa_full = true
no_context_shift = true
keep = 1024
parallel = 1
enable_thinking = false
jinja = true
mlock = true
