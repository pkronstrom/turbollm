[project]
name = "turbollm"
version = "0.2.0"
description = "Ollama-like CLI for local LLM serving on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "huggingface-hub>=0.20",
    "rich>=13.0",
]

[project.scripts]
turbo = "turbollm.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
